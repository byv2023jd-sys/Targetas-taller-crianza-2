<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Del piloto automático a la acción elegida</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--sf:#fff;--ink:#1c2631;--mut:#566474;--ln:#d5dbe3;--ac:#274a73;--acs:#e3ebf5;--rd:#a8302c;--rds:#fbeceb;--gn:#2a7448;--gns:#e6f3ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121820;--sf:#1b2430;--ink:#eaeff5;--mut:#a3b0c0;--ln:#34414f;--ac:#8fb4e3;--acs:#223348;--rd:#f19a95;--rds:#35201f;--gn:#85cfa3;--gns:#1b3025}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121820;--sf:#1b2430;--ink:#eaeff5;--mut:#a3b0c0;--ln:#34414f;--ac:#8fb4e3;--acs:#223348;--rd:#f19a95;--rds:#35201f;--gn:#85cfa3;--gns:#1b3025}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
main{max-width:760px;margin:0 auto;padding:16px 18px 56px}
p{margin:0 0 .9em;max-width:62ch}.mut{color:var(--mut)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 22px}
nav button{flex:1;min-width:110px;padding:9px 10px;border:2px solid var(--ln);background:var(--sf);color:var(--mut);border-radius:10px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{border-color:var(--ac);color:var(--ink);font-weight:700}nav button.ok{border-color:var(--gn)}nav button:disabled{opacity:.5;cursor:default}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px;margin-bottom:18px}
.panel.red{border-left:8px solid var(--rd)}.panel.green{border-left:8px solid var(--gn)}
label{display:block;font-weight:700;margin:14px 0 4px}label small{font-weight:400;color:var(--mut);display:block}
textarea{width:100%;min-height:76px;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--ln);border-radius:10px;resize:vertical}
textarea:focus{border-color:var(--ac);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:8px 14px;border:2px solid var(--ln);border-radius:99px;background:var(--sf);color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer}
.chip:hover,.chip.on{border-color:var(--ac);background:var(--acs)}
.btn{padding:12px 22px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ln)}.btn:disabled{opacity:.45}
:is(button,textarea):focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.stage{min-height:280px;text-align:center}
.stim{display:flex;align-items:center;justify-content:center;min-height:130px;font-size:3rem;font-weight:700}
.shape{width:92px;height:92px}.circle{border-radius:50%}.tri{clip-path:polygon(50% 4%,96% 92%,4% 92%)}.dia{clip-path:polygon(50% 2%,98% 50%,50% 98%,2% 50%)}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.opts .chip{min-width:96px;font-size:1rem}
.fb{min-height:1.6em;font-weight:700;margin:10px 0}.fb.good{color:var(--gn)}.fb.bad{color:var(--rd)}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px;margin:14px auto}
.pad{height:86px;border:3px solid transparent;border-radius:14px;font:700 1rem "Atkinson Hyperlegible",sans-serif;color:#fff;opacity:.55;cursor:pointer}.pad.lit{opacity:1;border-color:var(--ink);transform:scale(1.04)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:520px;margin:12px auto}
.cell{aspect-ratio:1;border:2px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--ink);font:700 1.05rem "Atkinson Hyperlegible",sans-serif;cursor:pointer;padding:0}
.cell.hit{background:var(--gns);border-color:var(--gn)}.cell.miss{background:var(--rds);border-color:var(--rd)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.cmp{grid-template-columns:1fr}h1{font-size:1.65rem}}
.cmp .panel{margin:0}.cmp h3{margin-top:0}.cmp b{display:block;margin-top:10px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:700}
.tag.r{background:var(--rds);color:var(--rd)}.tag.g{background:var(--gns);color:var(--gn)}
.note{background:var(--acs);border-radius:10px;padding:12px 14px;font-size:.95rem;margin:14px 0}
@media print{nav,.row,.noprint{display:none!important}body{background:#fff;color:#000}}
</style></head><body><main>
<h1>Del piloto automático a la acción elegida</h1>
<nav id="nav" aria-label="Fases"></nav>
<div id="app" aria-live="polite"></div>
</main>
<script>
const $=s=>document.querySelector(s),esc=t=>(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={ph:0,cards:[{s:'',h:'',o:''}],g:0,sc:[null,null,null,null],gr:[],play:false};
const EX=[
{l:'Pantallas y transiciones',s:'Es hora de apagar la pantalla y mi hijo/a se resiste o hace berrinche.',h:'Levanto la voz y apago el dispositivo de golpe.',o:'Prisa y cansancio; quiero que acabe rápido.'},
{l:'Tareas escolares',s:'Hay que hacer la tarea y no quiere empezar o se frustra.',h:'Le corrijo todo o termino haciéndola yo.',o:'Impaciencia y ganas de que salga perfecto.'},
{l:'Hora de dormir',s:'Pasa la hora de dormir y siguen despiertos pidiendo cosas.',h:'Amenazo con quitarles algo o me enojo.',o:'Agotamiento al final del día.'},
{l:'Discusiones y peleas',s:'Mis hijos discuten o me contestan mal.',h:'Grito, o castigo sin escuchar.',o:'Estrés acumulado; me lo tomo personal.'}];
const VAL=['Paciencia','Conexión','Firmeza serena','Presencia','Respeto','Confianza'];
const PH=['1. Tarjeta Roja','2. Retos mentales','3. Tarjeta Verde','4. Comparativa'];
function nav(){$('#nav').innerHTML=PH.map((p,i)=>`<button class="${i==S.ph?'on':i<S.ph?'ok':''}" ${i>S.ph?'disabled':''} data-i="${i}" ${i==S.ph?'aria-current="step"':''}>${p}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.ph=+b.dataset.i;S.play=false;go()})}
function go(){nav();[red,games,green,final][S.ph]();scrollTo(0,0)}
function bind(a,k,sel){document.querySelectorAll(sel).forEach(e=>e.oninput=()=>{a[+e.dataset.i][k||e.dataset.k]=e.value})}

/* FASE 1 */
function red(){
$('#app').innerHTML=`<p>Aquí no hay respuestas correctas ni culpa. Elegir qué te cuesta es el primer paso para notar cuándo actúas en piloto automático. Registra de 1 a 3 situaciones.</p>


${S.cards.map((c,i)=>`<section class="panel red"><h2>Tarjeta Roja ${i+1}</h2>
<label for="s${i}">Situación difícil<small>¿Qué ocurre en ese momento?</small></label><textarea id="s${i}" data-i="${i}" data-k="s">${esc(c.s)}</textarea>
<label for="h${i}">Conducta habitual<small>¿Qué sueles hacer o decir automáticamente?</small></label><textarea id="h${i}" data-i="${i}" data-k="h">${esc(c.h)}</textarea>
<label for="o${i}">Dificultades u obstáculos<small>¿Qué te dificulta actuar distinto en ese momento?</small></label><textarea id="o${i}" data-i="${i}" data-k="o">${esc(c.o)}</textarea>
${S.cards.length>1?`<div class="row"><button class="btn alt" data-d="${i}">Quitar esta tarjeta</button></div>`:''}</section>`).join('')}
<div class="row">${S.cards.length<3?'<button class="btn alt" id="add">+ Añadir otra situación</button>':''}<button class="btn" id="nx">Ir a los retos mentales</button></div><div class="fb bad" id="er"></div>`;
bind(S.cards,0,'textarea');
let act=0;document.querySelectorAll('textarea').forEach(t=>t.onfocus=()=>act=+t.dataset.i);
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const e=EX[+b.dataset.e],c=S.cards[Math.min(act,S.cards.length-1)];Object.assign(c,{s:e.s,h:e.h,o:e.o});red()});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.cards.splice(+b.dataset.d,1);red()});
const a=$('#add');if(a)a.onclick=()=>{S.cards.push({s:'',h:'',o:''});red()};
$('#nx').onclick=()=>{const ok=S.cards.filter(c=>c.s.trim()&&c.h.trim()&&c.o.trim());
if(!ok.length){$('#er').textContent='Completa los tres campos de al menos una tarjeta para continuar.';return}
S.cards=ok;S.gr=ok.map((_,i)=>S.gr[i]||{v:'',a:''});S.ph=1;go()}}

/* FASE 2 */
const G=[
{n:'Regla cambiante',w:'Flexibilidad cognitiva',d:'Clasificarás figuras según una regla que cambia sin avisar. Si fallas, pregúntate: ¿habrá cambiado el criterio?',m:'En casa pasa igual: lo que funcionó ayer puede no servir hoy. Notar el cambio y ajustarte es flexibilidad.',run:g1},
{n:'Pausa antes de responder',w:'Control inhibitorio',d:'Toca el botón solo cuando la TINTA de la palabra sea verde. No importa lo que diga la palabra. Son 30 palabras, 4 colores y menos de un segundo por palabra.',m:'Entre el impulso y la respuesta cabe una pausa. Esa pausa es lo que se entrena aquí.',run:g2},
{n:'Secuencia al revés',w:'Memoria de trabajo',d:'Mira la secuencia de colores y repítela en orden INVERSO (del último al primero). Son 4 rondas de 3 a 6 elementos.',m:'Sostener información y manipularla mentalmente ayuda a recordar tu valor justo cuando estás cansado/a.',run:g3},
{n:'Encuentra las M',w:'Atención selectiva',d:'Encuentra las 10 letras M escondidas entre 110 letras parecidas (N, H, W). Tómate tu tiempo; no hay reloj.',m:'Con estrés la atención se estrecha. Elegir hacia dónde miras es una decisión, no un reflejo.',run:g4}];
function games(){
const i=S.g;if(i>=4){$('#app').innerHTML=`<section class="panel"><h2>Retos completados</h2><p>Tu mente ya practicó salir del piloto automático: cambiar de regla, pausar, sostener información y enfocar. Ahora llevemos eso a tus situaciones reales.</p><div class="row"><button class="btn" id="nx">Crear mi Tarjeta Verde</button></div></section>`;$('#nx').onclick=()=>{S.ph=2;go()};return}
const g=G[i];
$('#app').innerHTML=`<div class="bar"><i style="width:${i*25}%"></i></div><section class="panel"><h2>Reto ${i+1} de 4: ${g.n}</h2><span class="tag r">${g.w}</span><p style="margin-top:12px">${g.d}</p><div class="note">${g.m}</div><div class="stage" id="st">${S.play?'':'<button class="btn" id="go">Empezar reto</button>'}</div></section>`;
if(!S.play){$('#go').onclick=()=>{S.play=true;g.run($('#st'))}}else{g.run($('#st'))}}
function fin(st,txt,good){S.sc[S.g]=txt;S.play=false;
st.innerHTML=`<h3>${txt}</h3><p>${good}</p><div class="row" style="justify-content:center"><button class="btn alt" id="rp">Repetir</button><button class="btn" id="nx">${S.g<3?'Siguiente reto':'Terminar retos'}</button></div>`;
$('#rp').onclick=()=>{S.play=true;G[S.g].run(st)};$('#nx').onclick=()=>{S.g++;S.play=false;games()}}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function g1(st){
const C=[['Rojo','#c0392b'],['Azul','#2563a8'],['Verde','#2a7448'],['Amarillo','#b8860b']],F=['Círculo','Cuadrado','Triángulo','Rombo'],FC=['circle','','tri','dia'];
const rules='cccffcccfffccfffccffccff'.split('');let t=0,ok=0;
function nxt(){if(t>=rules.length)return fin(st,`Aciertos: ${ok} de ${rules.length}`,'Cada cambio de regla exige soltar lo anterior. Si te costó, es normal: es justo lo que se entrena.');
const c=Math.floor(Math.random()*4),f=Math.floor(Math.random()*4);
st.innerHTML=`<div class="bar"><i style="width:${t/rules.length*100}%"></i></div><p class="mut">${t==0?'Primera regla: clasifica por COLOR. Después puede cambiar sin avisar.':'¿Qué regla toca ahora?'}</p><div class="stim"><div class="shape ${FC[f]}" style="background:${C[c][1]}"></div></div><div class="opts" role="group" aria-label="Color">${C.map((x,j)=>`<button class="chip" data-k="c" data-j="${j}">${x[0]}</button>`).join('')}</div><div class="opts" role="group" aria-label="Forma">${F.map((x,j)=>`<button class="chip" data-k="f" data-j="${j}">${x}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
st.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const r=rules[t],good=b.dataset.k==r&&+b.dataset.j==(r=='c'?c:f);
st.querySelectorAll('.chip').forEach(x=>x.disabled=true);if(good)ok++;
$('#fb').className='fb '+(good?'good':'bad');$('#fb').textContent=good?'Correcto':'Esa no era. ¿Habrá cambiado la regla? Era: '+(r=='c'?'color':'forma');t++;setTimeout(nxt,good?500:1400)})}
nxt()}
function g2(st){
const W=[['ROJO','#c0392b'],['VERDE','#2a7448'],['AZUL','#2563a8'],['AMARILLO','#b8860b']];const N=30;let t=0,ok=0,tm;
const T=Array.from({length:N},()=>{const k=Math.random()<.35?1:[0,2,3][Math.floor(Math.random()*3)];const w=k==1?[0,2,3][Math.floor(Math.random()*3)]:(Math.random()<.5?1:Math.floor(Math.random()*4));return{w,k}});
function nxt(){if(t>=N)return fin(st,`Decisiones correctas: ${ok} de ${N}`,'Las palabras empujan una respuesta automática. Notar el empujón y esperar es la base de responder distinto.');
const q=T[t];let hit=false;
st.innerHTML=`<div class="bar"><i style="width:${t/N*100}%"></i></div><p class="mut">Toca solo si la tinta es verde.</p><div class="stim" style="color:${W[q.k][1]}">${W[q.w][0]}</div><button class="btn" id="tp" style="min-width:200px;padding:16px">Tinta verde</button><div class="fb" id="fb"></div>`;
$('#tp').onclick=()=>{hit=true;$('#tp').disabled=true};
tm=setTimeout(()=>{const go=q.k==1,good=go==hit;if(good)ok++;$('#fb').className='fb '+(good?'good':'bad');$('#fb').textContent=good?'Bien':(go?'Era verde: había que tocar':'Era una trampa: había que esperar');t++;setTimeout(nxt,250)},650)}
nxt()}
function g3(st){
const P=[['Azul','#2563a8'],['Naranja','#b45f06'],['Verde','#2a7448'],['Morado','#7a3d9a']],L=[3,4,5,6];let r=0,ok=0;
function round(){if(r>=L.length)return fin(st,`Rondas superadas: ${ok} de 4`,'Invertir la secuencia obliga a sostener y transformar datos a la vez, como recordar tu valor mientras gestionas la situación.');
const seq=Array.from({length:L[r]},()=>Math.floor(Math.random()*4)),ans=[];
st.innerHTML=`<div class="bar"><i style="width:${r*25}%"></i></div><p>Ronda ${r+1}: ${L[r]} elementos. Repite al revés.</p><div class="pads">${P.map((p,i)=>`<button class="pad" data-i="${i}" style="background:${p[1]}" disabled>${p[0]}</button>`).join('')}</div><div class="fb" id="fb">Observa…</div>`;
const pads=[...st.querySelectorAll('.pad')];let k=0;
(function show(){if(k>=seq.length){pads.forEach(p=>p.disabled=false);$('#fb').textContent='Tu turno: del último al primero';return}
pads[seq[k]].classList.add('lit');setTimeout(()=>{pads[seq[k]].classList.remove('lit');k++;setTimeout(show,300)},750)})();
pads.forEach(p=>p.onclick=()=>{ans.push(+p.dataset.i);p.classList.add('lit');setTimeout(()=>p.classList.remove('lit'),200);
const exp=[...seq].reverse();const bad=ans.some((a,i)=>a!=exp[i]);
if(bad||ans.length==exp.length){pads.forEach(x=>x.disabled=true);if(!bad)ok++;$('#fb').className='fb '+(bad?'bad':'good');$('#fb').textContent=bad?'Esta vez no salió. Orden correcto: '+exp.map(i=>P[i][0]).join(', '):'¡Secuencia correcta!';r++;setTimeout(round,bad?2600:1100)}})}
round()}
function g4(st){
const n=10,cells=shuf(Array.from({length:120},(_,i)=>i<n?'M':'NHW'[i%3])),total=n;let found=0,err=0;
st.innerHTML=`<p class="mut">Encontradas: <b id="c">0</b> de ${total} · Errores: <b id="e">0</b></p><div class="grid">${cells.map((m,i)=>`<button class="cell" data-m="${m=='M'?1:0}" aria-label="letra ${m}">${m}</button>`).join('')}</div>`;
st.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{if(b.classList.contains('hit')||b.classList.contains('miss'))return;
if(b.dataset.m=='1'){b.classList.add('hit');found++;$('#c').textContent=found}else{b.classList.add('miss');err++;$('#e').textContent=err}
if(found==total)setTimeout(()=>fin(st,`Encontraste ${total} M con ${err} errores`,'Enfocar lo relevante entre mucho ruido es una habilidad que se entrena y que ayuda en los momentos de tensión.'),600)})}

/* FASE 3 */
function green(){
$('#app').innerHTML=`<p>Ahora conecta cada situación con lo que te importa como madre o padre. La acción debe ser pequeña, concreta y posible con tus obstáculos reales.</p>${S.cards.map((c,i)=>`<section class="panel green"><h2>Situación ${i+1}</h2>
<div class="panel red" style="background:var(--rds)"><b>Tarjeta Roja:</b> ${esc(c.s)}<br><b>Hago habitualmente:</b> ${esc(c.h)}<br><b>Me dificulta:</b> ${esc(c.o)}</div>
<label for="v${i}">Valor como padre/madre<small>¿Qué quieres priorizar aquí?</small></label>

<textarea id="v${i}" data-i="${i}" data-k="v">${esc(S.gr[i].v)}</textarea>
<label for="a${i}">Acción comprometida<small>¿Qué harías diferente la próxima vez? Algo concreto y realista, dados tus obstáculos.</small></label>
<textarea id="a${i}" data-i="${i}" data-k="a">${esc(S.gr[i].a)}</textarea></section>`).join('')}
<div class="row"><button class="btn" id="nx">Ver mi comparativa</button></div><div class="fb bad" id="er"></div>`;
bind(S.gr,0,'textarea');
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.gr[+b.dataset.i].v=b.dataset.v;green()});
$('#nx').onclick=()=>{if(S.gr.some(g=>!g.v.trim()||!g.a.trim())){$('#er').textContent='Elige un valor y escribe una acción en cada tarjeta.';return}S.ph=3;go()}}

/* FASE 4 */
function final(){
$('#app').innerHTML=`<p>Lo que ya hacías no era “malo”: era tu piloto automático haciendo lo que pudo. Esta es tu alternativa elegida.</p>${S.cards.map((c,i)=>`<div class="cmp" style="margin-bottom:16px"><div class="panel red"><span class="tag r">Tarjeta Roja</span><h3>${esc(c.s)}</h3><b>Conducta habitual</b>${esc(c.h)}<b>Obstáculos</b>${esc(c.o)}</div><div class="panel green"><span class="tag g">Tarjeta Verde</span><h3>${esc(S.gr[i].v)}</h3><b>Acción comprometida</b>${esc(S.gr[i].a)}<b>Obstáculos que tendré en cuenta</b>${esc(c.o)}</div></div>`).join('')}
<div class="row"><button class="btn" id="cp">Copiar al portapapeles</button><button class="btn alt" id="pr">Imprimir o guardar</button><button class="btn alt" id="rs">Empezar de nuevo</button></div><div class="fb good" id="fb" role="status"></div>`;
const txt=S.cards.map((c,i)=>`SITUACIÓN ${i+1}\nTARJETA ROJA\n- Situación difícil: ${c.s}\n- Conducta habitual: ${c.h}\n- Obstáculos: ${c.o}\nTARJETA VERDE\n- Valor: ${S.gr[i].v}\n- Acción comprometida: ${S.gr[i].a}`).join('\n\n');
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#fb').textContent='Copiado.'}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.append(t);t.select();try{document.execCommand('copy');$('#fb').textContent='Copiado.'}catch(x){$('#fb').textContent='No se pudo copiar. Selecciona el texto manualmente.'}t.remove()}};
$('#pr').onclick=()=>{try{print()}catch(e){$('#fb').textContent='Imprimir no está disponible aquí. Copia el texto y pégalo en un documento.'}};
$('#rs').onclick=()=>{Object.assign(S,{ph:0,cards:[{s:'',h:'',o:''}],g:0,sc:[null,null,null,null],gr:[],play:false});go()}}
go();
</script></body></html>
